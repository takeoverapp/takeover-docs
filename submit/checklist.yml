# Takeover pre-submission checklist
#
# Machine-readable companion to submit/checklist.md. Designed so an AI
# coding agent can iterate every item against a candidate adapter,
# hook module, or grid-launch flow and produce a structured pass/fail
# report before a human DM to @takeoverfun on X.
#
# Schema:
#   id           Stable identifier (used in reports and DMs).
#   category     contract | tests | audit | operational | documentation |
#                hook | grid_launch
#   severity     must | should
#   description  Prose from the human checklist.
#   verify       Structured hint for an automated checker:
#     kind: grep | grep_not | regex | test | chain | manual
#     pattern: ripgrep pattern (kind: grep | grep_not | regex)
#     glob:    file glob to constrain the search (optional)
#     test:    forge test name (kind: test)
#     question: human-resolvable question (kind: manual)
#   refs         Doc links the agent should cite if the check fails.
#
# Convention: an item passes when EVERY `verify` block passes.
#
# v2 schema additions:
#   - `hook.*`         category for IGridHooksV23 modules.
#   - `grid_launch.*`  category for grid creation flows
#                      (atomic, chunked, multi-grid sharding).
#   - `contract.collect_under_gas_cap` enforces the v2.3
#     ADAPTER_COLLECT_GAS_CAP = 600_000 budget.

version: 2
schema: takeover-checklist/v2
generated_for: UGM v2.3
last_reviewed: 2026-05-14

items:
  # ─── Contract ────────────────────────────────────────────────────────
  - id: contract.implements_iyieldadapter
    category: contract
    severity: must
    description: >-
      The adapter implements IYieldAdapter (collectYield + pendingYield)
      with the exact signatures.
    verify:
      - kind: grep
        pattern: 'function\s+collectYield\(bytes32\[\]\s+calldata\s+assetHashes\)\s+external'
        glob: 'src/**/*.sol'
      - kind: grep
        pattern: 'function\s+pendingYield\(bytes32\s+assetHash\)\s+external\s+view\s+returns\s+\(uint256'
        glob: 'src/**/*.sol'
    refs:
      - adapters/interface.md

  - id: contract.collectyield_msg_sender_ugm_only
    category: contract
    severity: must
    description: >-
      collectYield reverts if msg.sender is not UGM.
    verify:
      - kind: grep
        pattern: 'msg\.sender\s*!=\s*address\(ugm\)|msg\.sender\s*!=\s*address\(_ugm\)|NotUGM\(\)'
        glob: 'src/**/*.sol'
    refs:
      - adapters/interface.md
      - adapters/security.md

  - id: contract.collectyield_idempotent
    category: contract
    severity: must
    description: >-
      collectYield is idempotent — second call with no source-side activity
      moves zero tokens. (Verified primarily via the test in
      tests.idempotent_collect_zero.)
    verify:
      - kind: manual
        question: >-
          Does collectYield return early / no-op when there is nothing to
          collect (e.g., balance baseline check, lastFees comparison, or
          equivalent)? Cite the lines.
    refs:
      - adapters/interface.md

  - id: contract.collectyield_best_effort_per_asset
    category: contract
    severity: must
    description: >-
      collectYield is best-effort per asset — a problem with one asset
      doesn't revert the whole batch. Look for try/catch on the per-asset
      collect helper, or an explicit "skip on failure" branch.
    verify:
      - kind: regex
        pattern: 'try\s+this\.\w+|try\s+_collectSingle|continue;\s*\}|skip|catch\s*\('
        glob: 'src/**/*.sol'
      - kind: manual
        question: >-
          Is the per-asset error path exercised by a test that registers a
          fake/broken asset alongside good ones?
    refs:
      - adapters/interface.md

  - id: contract.pendingyield_pure_view
    category: contract
    severity: must
    description: >-
      pendingYield is a pure view — never reverts on missing/zero state,
      returns 0 for inactive assets.
    verify:
      - kind: grep
        pattern: 'function\s+pendingYield[^{]*\bview\b'
        glob: 'src/**/*.sol'
      - kind: manual
        question: >-
          Walk every branch of pendingYield. Confirm none of them can
          revert, including: unknown assetHash, source contract paused,
          token balance = 0, division by 0.
    refs:
      - adapters/interface.md

  - id: contract.yield_in_grid_yield_token
    category: contract
    severity: must
    description: >-
      Yield is forwarded in the grid's yieldToken units. ETH-yield grids
      accept flETH/WETH/ETH; ERC20-yield grids accept only that exact
      token.
    verify:
      - kind: grep
        pattern: 'receiveYieldETH|receiveYieldERC20'
        glob: 'src/**/*.sol'
      - kind: manual
        question: >-
          Cite where the adapter checks/asserts the source token matches
          the grid's yieldToken at deposit time, and where ETH-yield is
          unwrapped (if applicable) before calling receiveYieldETH.
    refs:
      - adapters/yield-token-rules.md

  - id: contract.forceapprove_for_erc20
    category: contract
    severity: must
    description: >-
      Uses forceApprove (not plain approve) for ERC20 approvals to UGM,
      so USDT-style tokens don't revert on non-zero allowance.
    verify:
      - kind: grep
        pattern: '\.forceApprove\('
        glob: 'src/**/*.sol'
      - kind: grep_not
        pattern: 'IERC20\([^)]*\)\.approve\(.*ugm|approve\(address\(ugm\)'
        glob: 'src/**/*.sol'
    refs:
      - adapters/security.md

  - id: contract.deposit_gates_grid_creator
    category: contract
    severity: must
    description: >-
      Deposit is gated on the grid creator, read freshly from
      ugm.gridConfigV22(gridId) (the v2.3 view that returns the same
      fields v2.2's gridConfig did, kept under the V22 name for
      indexer continuity).
    verify:
      - kind: grep
        pattern: 'gridConfigV22\([^)]*\)|ugm\.gridConfigV22'
        glob: 'src/**/*.sol'
      - kind: manual
        question: >-
          Does deposit() compare msg.sender to the creator field
          returned by gridConfigV22, with NotGridCreator() (or
          equivalent) on mismatch?
    refs:
      - adapters/lifecycle.md

  - id: contract.deposit_yield_token_match
    category: contract
    severity: must
    description: >-
      Deposit verifies that the source-side asset's yield denomination
      matches the grid's yieldToken.
    verify:
      - kind: manual
        question: >-
          Cite the exact check: e.g., require that the LP pool's currency0
          or currency1 == grid.yieldToken, or that the Flaunch coin's fee
          token is flETH for an ETH-yield grid.
    refs:
      - adapters/yield-token-rules.md

  - id: contract.asset_hash_unique_includes_source
    category: contract
    severity: must
    description: >-
      assetHash is unique per source-side object and includes the source
      contract address in its preimage.
    verify:
      - kind: regex
        pattern: 'keccak256\(\s*abi\.encodePacked\([^)]*\b(positionManager|flaunch|nft|source|token)\b[^)]*\)'
        glob: 'src/**/*.sol'
      - kind: manual
        question: >-
          Confirm the preimage cannot collide across two adapters
          targeting different source contracts.
    refs:
      - adapters/asset-hash.md

  - id: contract.withdraw_gated
    category: contract
    severity: must
    description: >-
      Withdraw is gated. Default reference gate is "grid creator holds
      all `grid.totalSeats`". A different gate is acceptable but must
      be documented on the example page.
    verify:
      - kind: grep
        pattern: 'holderSeatCount|seatCount\(.*creator|allSeats|NotAllSeatsHeld'
        glob: 'src/**/*.sol'
      - kind: manual
        question: >-
          What is the exact withdraw gate? Cite it.
    refs:
      - adapters/lifecycle.md

  - id: contract.withdraw_sweeps_last_yield
    category: contract
    severity: must
    description: >-
      Withdraw sweeps the last yield (e.g. _collectSingle) before
      transferring the source-side asset back to the creator.
    verify:
      - kind: manual
        question: >-
          Does withdraw call the per-asset collect helper (or equivalent)
          before the asset transfer? Cite the lines.
    refs:
      - adapters/lifecycle.md

  - id: contract.no_eoa_only_entrypoints
    category: contract
    severity: must
    description: >-
      No tx.origin checks or EOA-only modifiers. UI, zaps, and contracts
      all need to be able to integrate.
    verify:
      - kind: grep_not
        pattern: 'tx\.origin|onlyEOA|isContract\(.*\)\s*=='
        glob: 'src/**/*.sol'
    refs:
      - adapters/security.md

  - id: contract.owner_set_rescues_owner_only
    category: contract
    severity: must
    description: >-
      Owner is set in the constructor; emergency rescue functions are
      owner-only.
    verify:
      - kind: grep
        pattern: '_initializeOwner|Ownable|onlyOwner'
        glob: 'src/**/*.sol'
      - kind: manual
        question: >-
          List every owner-only function. Confirm none of them can
          re-route registered assets or steal pending yield.
    refs:
      - submit/audit-expectations.md

  - id: contract.no_unbounded_loops
    category: contract
    severity: must
    description: >-
      No unbounded loops on a hot path. Per-call work is capped.
    verify:
      - kind: manual
        question: >-
          For every loop in collectYield, deposit, withdraw, claim,
          identify the bound. If the bound is "length of an array the
          caller controls", show why a malicious caller cannot grow it
          unboundedly.
    refs:
      - adapters/security.md

  - id: contract.reentrancy_layout
    category: contract
    severity: must
    description: >-
      Adapter-only entrypoints (deposit, withdraw, poke, flush) are
      nonReentrant. collectYield is NOT nonReentrant — UGM already holds
      its lock on that path.
    verify:
      - kind: grep
        pattern: 'function\s+(deposit|withdraw|poke|flush)[^{]*nonReentrant'
        glob: 'src/**/*.sol'
      - kind: grep_not
        pattern: 'function\s+collectYield[^{]*nonReentrant'
        glob: 'src/**/*.sol'
    refs:
      - adapters/security.md
      - adapters/interface.md

  - id: contract.collect_under_gas_cap
    category: contract
    severity: must
    description: >-
      collectYield completes within ADAPTER_COLLECT_GAS_CAP = 600_000
      gas for the worst-case asset count this adapter expects to
      handle in production. Bound per-asset sub-loops; cache reads;
      avoid storage writes that aren't strictly necessary.
    verify:
      - kind: manual
        question: >-
          Cite the gas-bound argument: max assets per call, average
          gas-per-asset measured under `forge test --gas-report`, and
          the safety margin under 600_000.
    refs:
      - adapters/interface.md
      - adapters/security.md

  # ─── Tests ───────────────────────────────────────────────────────────
  - id: tests.happy_path_deposit_claim
    category: tests
    severity: must
    description: >-
      Happy path: deposit + claimFees moves seat balance.
    verify:
      - kind: manual
        question: >-
          Name the test (file + function) and the asserted balance
          delta.
    refs:
      - adapters/testing.md

  - id: tests.idempotent_collect_zero
    category: tests
    severity: must
    description: >-
      Calling claimFees twice in a row collects zero on the second call.
    verify:
      - kind: manual
        question: >-
          Name the test and the assertion that the second call's transfer
          amount is 0.
    refs:
      - adapters/testing.md

  - id: tests.fakehash_no_op
    category: tests
    severity: must
    description: >-
      collectYield([fakeHash]) is a no-op, not a revert.
    verify:
      - kind: manual
        question: >-
          Name the test and the un-asserted-revert wrapping.
    refs:
      - adapters/testing.md

  - id: tests.collect_only_from_ugm
    category: tests
    severity: must
    description: >-
      collectYield from any non-UGM caller reverts.
    verify:
      - kind: manual
        question: Name the test.
    refs:
      - adapters/security.md

  - id: tests.incompatible_yield_token
    category: tests
    severity: must
    description: >-
      Deposit on a grid with an incompatible yieldToken reverts.
    verify:
      - kind: manual
        question: Name the test.
    refs:
      - adapters/yield-token-rules.md

  - id: tests.withdraw_seat_gating
    category: tests
    severity: must
    description: >-
      Withdraw without all seats reverts; with all seats succeeds.
    verify:
      - kind: manual
        question: Name both tests.
    refs:
      - adapters/lifecycle.md

  - id: tests.approval_revoke_path
    category: tests
    severity: must
    description: >-
      After setApprovedAdapter(adapter, false), deposit reverts but
      residual yield still pushes and withdrawAsset still works for
      already-registered assets.
    verify:
      - kind: manual
        question: Name the test(s).
    refs:
      - submit/adapter-approval-process.md

  - id: tests.swap_path_fuzz
    category: tests
    severity: should
    description: >-
      If the adapter swaps, the swap path is fuzzed on edge prices
      (very low / very high sqrtPriceX96).
    verify:
      - kind: manual
        question: >-
          Does the adapter swap? If yes, name the fuzz test and its
          bounds.
    refs:
      - adapters/security.md

  - id: tests.coverage_collectyield_branches
    category: tests
    severity: must
    description: >-
      Foundry coverage is clean. Branch coverage on collectYield and any
      conversion helpers is near 100%.
    verify:
      - kind: manual
        question: >-
          Attach the relevant lines from `forge coverage --report
          summary` for collectYield and helpers.
    refs:
      - adapters/testing.md

  - id: tests.fork_test
    category: tests
    severity: must
    description: >-
      At least one fork test against the real source protocol on Base or
      Base Sepolia.
    verify:
      - kind: manual
        question: >-
          Name the fork test and the block number / fork URL it pins.
    refs:
      - adapters/testing.md

  # ─── Audit ───────────────────────────────────────────────────────────
  - id: audit.external_complete
    category: audit
    severity: must
    description: >-
      External audit complete. Auditor and report attached to the
      approval DM.
    verify:
      - kind: manual
        question: >-
          Auditor name + report URL or PDF + commit hash audited.
    refs:
      - submit/audit-expectations.md

  - id: audit.findings_resolved
    category: audit
    severity: must
    description: >-
      All critical/high findings resolved or
      accepted-with-justification.
    verify:
      - kind: manual
        question: >-
          List every C/H finding from the report and its resolution
          (commit hash or written justification).
    refs:
      - submit/audit-expectations.md

  - id: audit.slither_clean
    category: audit
    severity: should
    description: >-
      If Slither was used, the run is clean (or every suppression is
      documented).
    verify:
      - kind: manual
        question: >-
          Paste `slither .` summary, or document each suppression and
          its rationale.
    refs:
      - submit/audit-expectations.md

  # ─── Operational ────────────────────────────────────────────────────
  - id: operational.deploy_script_reproducible
    category: operational
    severity: must
    description: >-
      Adapter deployment script is reproducible (CREATE2 salt or
      forge-script with --slow + env-var-driven config).
    verify:
      - kind: manual
        question: >-
          Cite the script file and the salt / env var inputs.
    refs:
      - reference/deployments.md

  - id: operational.same_address_per_chain
    category: operational
    severity: should
    description: >-
      Adapter address is the same on every chain you intend to support
      (CREATE2). Not strictly required, but expected.
    verify:
      - kind: manual
        question: >-
          List the deployed addresses per chain.
    refs:
      - reference/deployments.md

  - id: operational.pitch_lines
    category: operational
    severity: must
    description: >-
      You can produce a 1-line "what does this adapter do" sentence and
      a 5-line "how the source produces yield" paragraph for the
      example page.
    verify:
      - kind: manual
        question: Paste both.
    refs:
      - adapters/examples/flaunch.md

  - id: operational.owner_key_story
    category: operational
    severity: must
    description: >-
      A wallet/key story for the adapter's Ownable role — multisig
      preferred for anything in production.
    verify:
      - kind: manual
        question: >-
          Owner address, key custody (multisig / EOA / TSS), and
          rotation plan.
    refs:
      - submit/audit-expectations.md

  # ─── Documentation ──────────────────────────────────────────────────
  - id: docs.example_walkthrough
    category: documentation
    severity: must
    description: >-
      Example walkthrough written: copy adapters/examples/flaunch.md,
      replace the contract-specific bits, add to SUMMARY.md.
    verify:
      - kind: manual
        question: PR URL adding the example page.
    refs:
      - adapters/examples/flaunch.md

  - id: docs.cross_links_for_novel_patterns
    category: documentation
    severity: should
    description: >-
      Any new pattern (push-only, multi-source, novel asset-hash
      convention) is cross-linked from adapters/building-an-adapter.md.
    verify:
      - kind: manual
        question: >-
          List any novel pattern and the cross-link.
    refs:
      - adapters/building-an-adapter.md

  # ─── Hook modules (IGridHooksV23) ────────────────────────────────────
  - id: hook.implements_igridhooksv23
    category: hook
    severity: must
    description: >-
      The module implements IGridHooksV23 (which extends
      IGridGovernanceHooks). At minimum the v2.2 callback
      `onSeatHolderChange` is implemented; v2.3 callbacks
      (`beforeClaim`, `beforeBuyout`, `beforePriceChange`,
      `onForfeit`, `yieldWeight`) are provided where the module's
      semantics require them.
    verify:
      - kind: grep
        pattern: 'is\s+IGridHooksV23|IGridGovernanceHooks'
        glob: 'src/**/*.sol'
      - kind: grep
        pattern: 'function\s+onSeatHolderChange\('
        glob: 'src/**/*.sol'
    refs:
      - hooks/interface.md

  - id: hook.onseatholderchange_keys_by_gridid
    category: hook
    severity: must
    description: >-
      All per-seat module state is keyed by (gridId, seatId), not just
      seatId. A single module instance must be safe to attach to
      multiple grids without state leaking between them.
    verify:
      - kind: regex
        pattern: 'mapping\(uint256\s*=>\s*mapping\(uint256\s*=>'
        glob: 'src/**/*.sol'
      - kind: manual
        question: >-
          Identify any per-seat storage that is keyed by seatId only.
          If found, justify why cross-grid bleed cannot happen, or
          rekey by (gridId, seatId).
    refs:
      - hooks/examples/whitelist-module.md

  - id: hook.beforeclaim_revert_blocks_acquisition
    category: hook
    severity: must
    description: >-
      A revert in `beforeClaim` blocks the acquisition. Tested with a
      negative case (e.g. a non-allowlisted address attempting a
      claim).
    verify:
      - kind: manual
        question: Name the test and the custom error it reverts with.
    refs:
      - hooks/lifecycle.md

  - id: hook.beforebuyout_revert_blocks_buyout
    category: hook
    severity: must
    description: >-
      A revert in `beforeBuyout` blocks the buyout. Tested with a
      negative case.
    verify:
      - kind: manual
        question: Name the test and the custom error it reverts with.
    refs:
      - hooks/lifecycle.md

  - id: hook.onforfeit_never_reverts
    category: hook
    severity: must
    description: >-
      `onForfeit` never reverts under any input. UGM swallows reverts
      from observers and emits `GovernanceHookSoftFail`; a reverting
      observer is a bug.
    verify:
      - kind: manual
        question: >-
          Walk every branch of `onForfeit`. Confirm none can revert
          (no require, no custom error, no division by zero, no
          unbounded loops).
    refs:
      - hooks/lifecycle.md

  - id: hook.yield_weight_within_gas_cap
    category: hook
    severity: must
    description: >-
      `yieldWeight` returns within GOVERNANCE_HOOK_GAS_CAP = 150_000
      gas for the worst-case (gridId, seatId) input this module
      expects. Verified via `forge test --gas-report`.
    verify:
      - kind: manual
        question: >-
          Paste the gas-report row for `yieldWeight`. Identify the
          worst-case path and the safety margin under 150_000.
    refs:
      - hooks/interface.md
      - hooks/lifecycle.md

  - id: hook.no_state_writes_in_yield_weight
    category: hook
    severity: must
    description: >-
      `yieldWeight` is a pure view — no SSTORE on any branch. UGM
      invokes it via staticcall; any write reverts and UGM falls back
      to the equal-share `1/totalSeats` distribution.
    verify:
      - kind: grep
        pattern: 'function\s+yieldWeight[^{]*\bview\b'
        glob: 'src/**/*.sol'
      - kind: manual
        question: >-
          Walk every branch of `yieldWeight`. Confirm no SSTORE,
          no external call to a contract that itself writes, no
          delegatecall.
    refs:
      - hooks/interface.md

  - id: hook.module_transfer_seat_only_attached_module
    category: hook
    severity: should
    description: >-
      If the module calls `moduleTransferSeat`, it does so only when
      it is also the attached governance module on that grid (i.e.
      `ugm.gridGovernanceModule(gridId) == address(this)`). UGM
      enforces this; the module should encode it explicitly so
      tests can lock the invariant.
    verify:
      - kind: manual
        question: >-
          If applicable, name the module's wrapper around
          `moduleTransferSeat` and the assertion guarding it.
    refs:
      - hooks/module-transfer-seat.md

  - id: hook.module_transfer_seat_refund_modes
    category: hook
    severity: should
    description: >-
      If the module calls `moduleTransferSeat`, it documents which
      `SeatTransferRefund` mode it uses (`None` or `Deposit`) and
      under which conditions. The module never invents a `Price`
      mode — phantom buyouts must route through `addBatch`.
    verify:
      - kind: manual
        question: >-
          Document the refund-mode policy. Cite the source location
          where the mode is selected.
    refs:
      - hooks/module-transfer-seat.md

  - id: hook.fork_test_e2e_v23
    category: hook
    severity: must
    description: >-
      At least one fork test exercises the module attached to a real
      v2.3 UGM (mainnet or Sepolia per reference/deployments.md).
      The test runs a full seat lifecycle (claim → setPrice →
      buyout / forfeit) with the module installed.
    verify:
      - kind: manual
        question: >-
          Name the fork test and the block number / fork URL it
          pins.
    refs:
      - reference/deployments.md
      - hooks/lifecycle.md

  - id: hook.descriptor_present
    category: hook
    severity: should
    description: >-
      Module implements `IHookDescriptor` so frontends and the
      `/builders/contracts` page can surface its kind, version, and
      supported callbacks without reading source.
    verify:
      - kind: grep
        pattern: 'is\s+IHookDescriptor|hookKind\(\)|supportedCallbacks\(\)'
        glob: 'src/**/*.sol'
    refs:
      - hooks/interface.md

  # ─── Grid launch flows ──────────────────────────────────────────────
  - id: grid_launch.path_chosen_by_total_seats
    category: grid_launch
    severity: must
    description: >-
      The launch flow chooses the right creation path purely from
      `totalSeats`: ≤1024 → atomic `createGrid`; 1025–4096 → chunked
      `createGridShell` + `appendInitialPricingChunk`; >4096 →
      SDK-side multi-grid sharding.
    verify:
      - kind: manual
        question: >-
          Cite the branch (or test) that picks the path. Show that
          a request for >1024 seats does NOT call `createGrid`.
    refs:
      - skills/launch-grid.md
      - boards/sharding.md

  - id: grid_launch.params_within_validation_bounds
    category: grid_launch
    severity: must
    description: >-
      All `CreateGridParams` / `CreateGridShellParams` fields land
      inside the contract's validation bounds: `taxRateBps` 0 or
      [100, 1000]; `totalSeats` [4, 4096]; `forfeitureDuration` 0
      or ≤ 30 days; `taxToken` is on the guardian's allowlist;
      `initialPrices.length == totalSeats` on the atomic path.
    verify:
      - kind: manual
        question: >-
          Cite the validation site. If validation runs only at the
          contract boundary, cite the test that exercises every
          revert (e.g. `TotalSeatsOutOfBounds`,
          `InitialPricesLengthMismatch`).
    refs:
      - boards/creating-a-grid.md
      - skills/launch-grid.md

  - id: grid_launch.chunked_completes_pricing
    category: grid_launch
    severity: must
    description: >-
      For chunked launches, the flow waits for
      `GridInitialPricingComplete(gridId)` before any seat-economic
      op. UGM reverts seat acquires with `InitialPricingIncomplete()`
      until every chunk has landed.
    verify:
      - kind: manual
        question: >-
          Cite the wait / decode path. If applicable, name the test
          that asserts `claim` reverts with
          `InitialPricingIncomplete()` while pricing is partial.
    refs:
      - boards/sharding.md

